[project]
name = "olympos"
version = "0.9.0"
description = "One page that shows how every project and home system is doing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
olympos = "olympos.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["olympos"]

[tool.setuptools.package-data]
olympos = ["static/*"]
